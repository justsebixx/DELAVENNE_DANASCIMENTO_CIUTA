# Configuration du serveur
server.port=8080
spring.application.name=bibliotheque-backend

# Configuration de la base de données MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bibliotheque?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=DT
spring.datasource.password=Password123.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuration JWT
jwt.secret=mySecretKeyForJWTTokenGenerationThatIsVeryLongAndSecure123456789
jwt.expiration=86400000

# Configuration de logging
logging.level.org.springframework.security=DEBUG
logging.level.com.bibliotheque=DEBUG

# Configuration de l'encodage
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
