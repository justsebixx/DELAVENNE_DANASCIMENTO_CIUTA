spring.application.name=bibliotheque_quali_dev
server.servlet.context-path=/api

# Configuration MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/bibliotheque
spring.datasource.username=bibli
spring.datasource.password=mdp123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Logging
logging.level.root=INFO
logging.level.com.example.bibliotheque_quali_dev=DEBUG
logging.level.org.springframework.web=TRACE
logging.level.org.springframework.web.servlet.mvc.method.annotation=TRACE
logging.level.org.hibernate=ERROR

