services:
  mysql:
    image: mysql:8.0
    container_name: bibliotheque-mysql
    environment:
      MYSQL_DATABASE: bibliotheque
      MYSQL_USER: bibli
      MYSQL_PASSWORD: mdp123
      MYSQL_ROOT_PASSWORD: mdp123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
